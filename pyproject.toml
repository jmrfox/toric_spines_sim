[project]
name = "toric-spines-sim"
version = "0.1.0"
description = "Arbor simulations of barn-owl toric spines (Sanculi et al., 2020)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arbor>=0.11.0",
    "dill>=0.4.1",
    "ipykernel>=6.30.1",
    "jscip",
    "jupyter>=1.1.1",
    "kaleido>=1.2.0",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "plotly>=6.3.0",
    "pynapple",
    "reportlab>=4.4.4",
    "scipy>=1.16.3",
    "swctools",
    "tqdm>=4.67.1",
    "dash>=4.1.0",
    "pymcfs",
    # mascaf's package __init__ imports visualization (needs pyvista from viz extra)
    "mascaf[viz]",
    "trimesh>=4.0.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toric_spines_sim"]

[tool.uv.sources]
jscip = { git = "https://github.com/jmrfox/jscip.git" }
swctools = { git = "https://github.com/jmrfox/swctools.git" }
neurosignature = { git = "https://github.com/jmrfox/neurosignature.git" }
pymcfs = { git = "https://github.com/jmrfox/pymcfs.git", branch = "release" }
mascaf = { git = "https://github.com/jmrfox/mascaf.git", branch = "release" }

[dependency-groups]
dev = [
    "jupytext>=1.19.3",
    "pytest>=8.0.0",
]
neurosignature = [
    "neurosignature",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.30",
]
